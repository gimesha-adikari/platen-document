name: Release

# Keep release.yml and the pypi environment stable for Trusted Publishing.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify release tag and reviewed main ancestry
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          EXPECTED_TAG="v${PROJECT_VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' does not match '${EXPECTED_TAG}'."
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::Tagged commit is not reachable from main; refusing to publish an unreviewed branch commit."
            exit 1
          fi

      - name: Verify the package version is absent from PyPI
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          URL="https://pypi.org/pypi/platen-document/${PROJECT_VERSION}/json"

          if ! HTTP_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "${URL}")"; then
            echo "::error::Could not verify PyPI version availability; publication is blocked."
            exit 1
          fi

          case "${HTTP_STATUS}" in
            404)
              echo "PyPI reports ${PROJECT_VERSION} is absent."
              ;;
            200)
              echo "::error::PyPI already has ${PROJECT_VERSION}; versions are immutable."
              exit 1
              ;;
            *)
              echo "::error::Unexpected PyPI response HTTP ${HTTP_STATUS}; publication is blocked."
              exit 1
              ;;
          esac

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-sin \
            tesseract-ocr-tam \
            qpdf

      - name: Install declared package and test dependencies
        run: python -m pip install ".[dev]"

      - name: Run SDK test suite
        run: python -m pytest -q

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Qualify the clean installed release wheel
        shell: bash
        env:
          SDK_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          RELEASE_SMOKE_ROOT="$(mktemp -d "${RUNNER_TEMP}/release-wheel-smoke.XXXXXX")"
          trap 'rm -rf "${RELEASE_SMOKE_ROOT}"' EXIT
          python -m venv "${RELEASE_SMOKE_ROOT}/venv"
          "${RELEASE_SMOKE_ROOT}/venv/bin/python" -m pip install --disable-pip-version-check "${SDK_WORKSPACE}"/dist/*.whl
          cat > "${RELEASE_SMOKE_ROOT}/verify_release_wheel.py" <<'PY'
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import sys
          import sysconfig
          import tomllib

          import platen_document
          from platen_document.cli import main

          workspace = Path(os.environ["SDK_WORKSPACE"]).resolve()
          expected_version = tomllib.loads((workspace / "pyproject.toml").read_text())["project"]["version"]
          site_packages = Path(sysconfig.get_path("purelib")).resolve()
          distribution = importlib.metadata.distribution("platen-document")
          assert sys.prefix != sys.base_prefix, "Release wheel must use a virtual environment"
          assert os.environ["GITHUB_REF_NAME"] == f"v{expected_version}", "Release tag/version mismatch"
          assert distribution.version == expected_version, (distribution.version, expected_version)
          assert Path(distribution.locate_file("")).resolve().is_relative_to(site_packages)
          assert Path(platen_document.__file__).resolve().is_relative_to(site_packages)
          assert not any(
              Path(item or os.getcwd()).resolve().is_relative_to(workspace) for item in sys.path
          ), "Source checkout must not be on the import path"
          direct_url = distribution.read_text("direct_url.json")
          if direct_url:
              assert not json.loads(direct_url).get("dir_info", {}).get("editable", False)

          if expected_version == "0.1.9":
              from platen_document import ConfigurationError, RasterAdmissionError
              from platen_document.engine.errors import (
                  ConfigurationError as EngineConfigurationError,
                  RasterAdmissionError as EngineRasterAdmissionError,
              )
              from platen_document.engine.geometry import (
                  HARD_MAX_RASTER_PIXELS, MAX_RASTER_DPI, MAX_RASTER_AXIS,
              )

              assert ConfigurationError is EngineConfigurationError
              assert RasterAdmissionError is EngineRasterAdmissionError
              assert issubclass(ConfigurationError, Exception)
              assert issubclass(RasterAdmissionError, Exception)
              assert type(HARD_MAX_RASTER_PIXELS) is int and HARD_MAX_RASTER_PIXELS == 10_000_000
              assert type(MAX_RASTER_DPI) is int and MAX_RASTER_DPI == 600
              assert type(MAX_RASTER_AXIS) is int and MAX_RASTER_AXIS == 32_768

          # Exercise the installed CLI without processing or rendering a document.
          assert main(["doctor"]) == 0
          for name, module in tuple(sys.modules.items()):
              if name == "platen_document" or name.startswith("platen_document."):
                  path = getattr(module, "__file__", None)
                  if path:
                      assert Path(path).resolve().is_relative_to(site_packages), (name, path)
          print(f"Qualified release wheel {distribution.version}: {platen_document.__file__}")
          PY
          cd "${RELEASE_SMOKE_ROOT}"
          "${RELEASE_SMOKE_ROOT}/venv/bin/python" -I "${RELEASE_SMOKE_ROOT}/verify_release_wheel.py"

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/platen-document
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
