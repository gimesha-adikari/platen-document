name: Release

# Keep release.yml and the pypi environment stable for Trusted Publishing.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify release tag and reviewed main ancestry
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          EXPECTED_TAG="v${PROJECT_VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' does not match '${EXPECTED_TAG}'."
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::Tagged commit is not reachable from main; refusing to publish an unreviewed branch commit."
            exit 1
          fi

      - name: Verify the package version is absent from PyPI
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          URL="https://pypi.org/pypi/platen-document/${PROJECT_VERSION}/json"

          if ! HTTP_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "${URL}")"; then
            echo "::error::Could not verify PyPI version availability; publication is blocked."
            exit 1
          fi

          case "${HTTP_STATUS}" in
            404)
              echo "PyPI reports ${PROJECT_VERSION} is absent."
              ;;
            200)
              echo "::error::PyPI already has ${PROJECT_VERSION}; versions are immutable."
              exit 1
              ;;
            *)
              echo "::error::Unexpected PyPI response HTTP ${HTTP_STATUS}; publication is blocked."
              exit 1
              ;;
          esac

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-sin \
            tesseract-ocr-tam \
            qpdf

      - name: Install declared package and test dependencies
        run: python -m pip install ".[dev]"

      - name: Run SDK test suite
        run: python -m pytest -q

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/platen-document
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
