name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng

      - name: Verify release tag and version immutability
        run: |
          PROJECT_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "Package version in pyproject.toml: ${PROJECT_VERSION}"

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            EXPECTED_TAG="v${PROJECT_VERSION}"
            echo "Release tag: ${TAG_NAME}"
            if [ "${TAG_NAME}" != "${EXPECTED_TAG}" ] && [ "${TAG_NAME}" != "${PROJECT_VERSION}" ]; then
              echo "::error::Tag '${TAG_NAME}' does not match pyproject.toml version '${PROJECT_VERSION}' (expected '${EXPECTED_TAG}')"
              exit 1
            fi
          fi

          echo "Checking if version ${PROJECT_VERSION} already exists on PyPI..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/platen-document/${PROJECT_VERSION}/json")
          if [ "${HTTP_STATUS}" = "200" ]; then
            echo "::error::Version ${PROJECT_VERSION} already exists on PyPI! PyPI versions are immutable."
            exit 1
          else
            echo "Version ${PROJECT_VERSION} is not on PyPI (HTTP ${HTTP_STATUS}). Safe to proceed."
          fi

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest
          python -m pip install .

      - name: Run test suite
        run: |
          python -m pytest

      - name: Build distributions
        run: |
          python -m build

      - name: Validate distribution metadata
        run: |
          python -m twine check dist/*

      - name: Clean-wheel installation smoke test
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/python -c '
          import platen_document
          print("Imported platen_document from:", platen_document.__file__)
          assert "site-packages" in platen_document.__file__, "Must import from site-packages"
          from platen_document import DocumentProcessor, EngineConfiguration, OCRProfile
          import importlib.metadata
          ver = importlib.metadata.version("platen-document")
          print("Installed package version:", ver)
          assert ver, "Version cannot be empty"
          '
          /tmp/smoke-venv/bin/platen-document doctor
          rm -rf /tmp/smoke-venv

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/platen-document
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
