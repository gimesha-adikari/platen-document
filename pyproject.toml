[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platen-document"
version = "0.1.4"
description = "Standalone local document-processing SDK extracted from PDFNest OCR V2"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Gimesha Nirmal", email = "gimeshaadikari23@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.0",
    "Pillow>=12.3.0",
    "pdfplumber>=0.11.10",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/gimesha-adikari/platen-document"
Repository = "https://github.com/gimesha-adikari/platen-document.git"
Issues = "https://github.com/gimesha-adikari/platen-document/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "build>=1.2.0",
    "twine>=6.0.0",
]

[project.scripts]
platen-document = "platen_document.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
