[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platen-document"
version = "0.1.0"
description = "Standalone local document-processing SDK extracted from PDFNest OCR V2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.0",
    "Pillow>=12.3.0",
    "pdfplumber>=0.11.10",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
platen-document = "platen_document.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
